name: Storefront checks

on:
  push:
    branches:
      - atlas-production-hardening
      - cloudflare-storefront-staging
      - main
      - original-works-automation-2026-07-21
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run storefront tests
        run: npm test
      - name: Validate site files
        run: npm run validate
