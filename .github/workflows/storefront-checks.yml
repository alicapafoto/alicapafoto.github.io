name: Storefront checks

on:
  push:
    branches:
      - atlas-production-hardening
      - cloudflare-storefront-staging
      - main
      - original-works-automation-2026-07-21
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run private fulfilment security tests
        id: private_fulfilment_tests
        shell: bash
        run: |
          set +e
          node scripts/test-original-artwork-fulfilment.mjs > private-fulfilment-test.log 2>&1
          status=$?
          cat private-fulfilment-test.log
          exit $status
      - name: Upload private fulfilment failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: private-fulfilment-test-log
          path: private-fulfilment-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Run private admin UI privacy tests
        run: node scripts/test-original-artwork-admin-ui.mjs
      - name: Run storefront tests
        run: npm test
      - name: Validate site files
        run: npm run validate
